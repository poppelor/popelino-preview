<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Popelino · חנות</title><link rel="icon" href="assets/flower.svg"><link rel="stylesheet" href="site.css"></head><body>
<header class="nav"></header>
<div class="wrap"><div class="crumb"><a href="index.html">דף הבית</a> / <a href="index.html#shop">חנות</a> / <span id="cn"></span></div>
<div class="cat-h"><div><h1 id="ct"></h1><p id="cl"></p></div><a class="btn ghost sm" href="index.html">→ חזרה לדף הבית</a></div>
<div class="chips" id="chips"></div>
<div class="cat-g"><div><p class="count" id="cnt"></p><div class="grid" id="grid"></div></div>
<aside class="side"><div id="sst"></div><div id="sctl"></div></aside></div></div>
<footer><div class="wrap"><a href="index.html"><img src="assets/logo-transparent.png" alt="Popelino"></a><nav><a href="index.html">דף הבית</a><a href="category.html?c=dollhouse">בית בובות</a><a href="category.html?c=shelf">כוננית</a><a href="category.html?c=table">שולחן</a><a href="category.html?c=kitchen">מטבח</a></nav><span>© 2026 Popelino · מחירים ותמונות לדוגמה</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="skins.js"></script><script src="site.js"></script>
<script>
const P=window.POP,k=new URLSearchParams(location.search).get('c'),c=P.CATS[k]?k:'dollhouse',C=P.CATS[c];
document.title='Popelino · '+C.name+' '+C.ikea;
document.getElementById('cn').textContent=C.name;document.getElementById('ct').textContent=C.name+' '+C.ikea;document.getElementById('cl').textContent=C.lead+' '+C.designs.length+' עיצובים.';
const packs=[...new Set(Object.values(P.PACKS).map(p=>p.id))].map(id=>P.ALL[id]).filter(p=>p.cat==c);
const items=[...C.designs,...packs];
const T=TryOn(document.getElementById('sctl'),{stageEl:document.getElementById('sst'),cat:c,title:true,compact:true,onDesign:d=>{}});
let f='all';
function draw(){const list=f=='all'?items:f=='packs'?packs:items.filter(d=>d.id==f);
 document.getElementById('grid').innerHTML=list.map(P.card).join('');document.getElementById('cnt').textContent=list.length+' מוצרים';
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f==f));
 document.querySelectorAll('#grid [data-try]').forEach(el=>el.onclick=()=>{const d=P.ALL[el.dataset.try];if(!d.pack){T.setDesign(d.id);if(innerWidth<820)document.querySelector('.side').scrollIntoView({behavior:'smooth',block:'start'})}});
 P.reveal()}
document.getElementById('chips').innerHTML=`<button class="chip all" data-f="all">הכל</button>`+C.designs.map(d=>`<button class="chip" data-f="${d.id}">${P.swatch(d)}${d.short}</button>`).join('')+(packs.length?`<button class="chip all" data-f="packs">ערכות אביזרים</button>`:'');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{f=b.dataset.f;if(f!='all'&&f!='packs')T.setDesign(f);draw()});
draw();
</script></body></html>
