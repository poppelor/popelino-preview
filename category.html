<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Popelino · חנות</title><link rel="icon" href="assets/flower.svg"><link rel="stylesheet" href="site.css"></head><body>
<header class="nav"></header>
<main class="split">
<div class="arch"><div class="crumb"><a href="index.html">דף הבית</a> / <a href="index.html#shop">חנות</a> / <span id="cn"></span></div>
<div class="cat-h"><div><h1 id="ct"></h1><p id="cl"></p></div></div>
<p class="count" id="cnt"></p><div class="grid pgrid" id="grid"></div></div>
<aside class="side" aria-label="תצוגה גדולה של המוצר"><span class="sheet-grab"></span><button class="icon-btn sheet-x" aria-label="סגירה">✕</button><div id="sst"></div><div id="sctl"></div></aside>
<button class="btn acc try-fab">✨ נסו על הרהיט</button></main><div class="sheet-scrim"></div>
<footer><div class="wrap"><a href="index.html"><img src="assets/logo-transparent.png" alt="Popelino"></a><nav><a href="index.html">דף הבית</a><a href="category.html?c=dollhouse">בית בובות</a><a href="category.html?c=shelf">כוננית</a><a href="category.html?c=table">שולחן</a><a href="category.html?c=kitchen">מטבח</a></nav><span>© 2026 Popelino · מחירים ותמונות לדוגמה</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="skins.js"></script><script src="site.js"></script>
<script>
const P=window.POP,k=new URLSearchParams(location.search).get('c'),c=P.CATS[k]?k:'dollhouse',C=P.CATS[c];
document.title='Popelino · '+C.name+' '+C.ikea;
document.getElementById('cn').textContent=C.name;document.getElementById('ct').textContent=C.name+' '+C.ikea;document.getElementById('cl').textContent=C.lead+' '+C.designs.length+' עיצובים.';
const packs=[...new Set(Object.values(P.PACKS).map(p=>p.id))].map(id=>P.ALL[id]).filter(p=>p.cat==c);
const items=[...C.designs,...packs];
const TINT={dollhouse:'var(--blush)',shelf:'var(--sage)',table:'var(--butter)',kitchen:'var(--sky)'},TC=['var(--sage)','var(--blush)','var(--butter)','var(--sky)'];
document.querySelector('.side').style.setProperty('--t',TINT[c]);
const T=TryOn(document.getElementById('sctl'),{stageEl:document.getElementById('sst'),cat:c,title:true,compact:true,cut:true,fade:160,packLbl:'השלימו עם ערכת האביזרים',onDesign:d=>document.querySelectorAll('.pcard').forEach(e=>e.classList.toggle('on',e.dataset.id==d.id))});
const card=(d,i)=>{const C=P.CATS[d.cat],im=d.pack?P.packThumb(d):d.w?P.houseSVG(d.w):d.cut?`<img class="c" src="${d.cut}" alt="${d.name}" loading="lazy">`:`<img class="ph" src="${d.img}" alt="${d.name}" loading="lazy">`;
 return `<article class="pcard rv${d.pack?' pk':''}${T.des&&T.des.id==d.id?' on':''}" data-id="${d.id}" style="--t:${TC[i%4]}"><div class="im" data-try="${d.id}">${d.pack?'<span class="tag">ערכת אביזרים · נמכרת בנפרד</span>':''}${im}</div><div class="bd"><div><h3>${d.pack?d.name:C.name+' · '+d.name}</h3><span class="meta">${d.pack?'ערכת אביזרים':C.ikea}</span></div><b>₪${d.price}</b></div><button class="add" data-add="${d.id}">+ הוסיפו לסל</button></article>`};
C.designs.forEach(d=>{if(d.ov)new Image().src=d.ov});new Image().src=C.base||C.thumb;C.designs.forEach(d=>{if(d.cut)new Image().src=d.cut});
let f='all';
function draw(){const list=f=='all'?items:f=='packs'?packs:items.filter(d=>d.id==f);
 document.getElementById('grid').innerHTML=list.map(card).join('');document.getElementById('cnt').textContent=list.length+' מוצרים';
 document.querySelectorAll('#grid .pcard:not(.pk)').forEach(el=>{el.addEventListener('mouseenter',()=>{if(matchMedia('(hover:hover) and (min-width:821px)').matches)T.setDesign(el.dataset.id,true)})});
 document.querySelectorAll('#grid [data-try]').forEach(el=>el.onclick=()=>{const d=P.ALL[el.dataset.try];if(!d.pack){T.setDesign(d.id);if(innerWidth<=820)sheet(true)}});
 P.reveal()}
const side=document.querySelector('.side'),scr=document.querySelector('.sheet-scrim');
function sheet(o){side.classList.toggle('open',o);scr.classList.toggle('on',o)}
document.querySelector('.try-fab').onclick=()=>sheet(true);document.querySelector('.sheet-x').onclick=()=>sheet(false);scr.onclick=()=>sheet(false);
addEventListener('keydown',e=>{if(e.key=='Escape')sheet(false)});
draw();
</script></body></html>
